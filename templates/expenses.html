{% extends "layout.html" %}

{% block title %} Expenses {% endblock %}

{% block body %}
<h1>Expenses</h1>

<table>
    <tr>
        <th>Amount</th>
        <th>Account</th>
        <th>Main Category</th>
        <th>Sub Category</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
    <tr>
        <td>
            <form action="/expenses/add" method="POST">
                <input type="number" name="amount" id="amount" step="0.01" required>
        </td>
        <td>
                <select name="account_id" id="account_id" required>
                    <option value="" disabled selected>Select an account</option>
                    {% for account in accounts %}
                    <option value="{{ account['id'] }}">{{ account['account_name'] }}</option>
                    {% endfor %}
                </select>
        </td>
        <td>
                <input type="text" name="main_category" id="main_category" required>
        </td>
        <td>
                <input type="text" name="sub_category" id="sub_category">
        </td>
        <td>
                <input type="date" name="date" id="date" required>
        </td>
        <td>
                <button type="submit">add</button>
                </form>
        </td>
    </tr>
    {% for row in rows %}
    <tr>
        <td>
            <form action="/expenses/edit" method="POST">
                <input type="hidden" name="id" id="id" value="{{ row['id'] }}" required>
                <input type="number" name="amount" id="amount" step="0.01" value="{{ row['amount'] }}" disabled required>
        </td>
        <td>
                <select name="account_id" id="account_id" required disabled>
                    {% for account in accounts %}
                    {% if account['id'] == row['account_id'] %}
                    <option value="{{ account['id'] }}" selected>{{ account['account_name'] }}</option>
                    {% else %}
                    <option value="{{ account['id'] }}">{{ account['account_name'] }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
        </td>
        <td>
                <input type="text" name="main_category" id="main_category" value="{{ row['main_category'] }}" required disabled>
        </td>
        <td>
                <input type="text" name="sub_category" id="sub_category" value="{{ row['sub_category'] }}" disabled>
        </td>
        <td>
                <input type="date" name="date" id="date" value="{{ row['record_date'] }}" required disabled>
        </td>
        <td>
                <button type="submit" class="conform-btn" hidden>Conform</button>
            </form>
            <button class="cancel-btn" hidden>Cancel</button>
            <button class="edit-btn">Edit</button>
            <form action="/expenses/remove" method="POST">
                <input type="hidden" name="id" id="id" value="{{ row['id'] }}" required>
                <input type="hidden" name="amount" id="amount" step="0.01" value="{{ row['amount'] }}" required>
                <input type="hidden" name="account_id" id="account_id" value="{{ row['account_id'] }}" required>
                <button type="submit">Remove</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
