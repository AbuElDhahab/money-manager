{% extends "layout.html" %}


{% block body %}

<!-- 
Load database into the page 
Each record has it's own form to edit or remove it 
-->
<h1>Income Records</h1>

<table>
    <tr>
        <th>Amount</th>
        <th>Source</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
    <tr>
        <!-- A form to record new income -->
         <td>
            <form action="/income/add" method="POST">
                <input type="number" name="amount" id="amount" step="0.01" required>
         </td>
         <td>
                <input type="text" name="source" id="source" required>
         </td>
         <td>
                <input type="date" name="date" id="date" required>
         </td>
         <td>
                <button type="submit">add</button>
            </form>
         </td>
    </tr>
    {% for row in rows %}
    <tr>
        <td>
            <form action="/income/edit" method="POST">
                <input type="hidden" name="id" id="id" value="{{ row['id'] }}" required>
                <input type="number" name="amount" id="amount" step="0.01" value="{{ row['amount'] }}" disabled required>
        </td>
        <td>
                <input type="text" name="source" id="source" value="{{ row['source'] }}" disabled required>
        </td>
        <td>
                <input type="date" name="date" id="date" value="{{ row['record_date'] }}" disabled required>
        </td>
        <td>
                <button type="submit" class="conform-btn" hidden>Conform</button>
            </form>
            <button class="cancel-btn" hidden>Cancel</button>
            <button class="edit-btn">Edit</button>
            <form action="/income/remove" method="POST">
                <input type="hidden" name="id" id="id" value="{{ row['id'] }}" required>
                <input type="hidden" name="amount" id="amount" value="{{ row['amount'] }}" required>
                <button type="submit">Remove</button>
            </form>
        </td>    
    </tr>
    {% endfor %}
</table>

{% endblock %}
