<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %} · Ledger</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <aside class="nav">
    <a class="brand" href="{{ url_for('overview.index') }}">Ledger</a>
    <nav>
      <a href="{{ url_for('overview.index') }}" class="{{ 'on' if page=='overview' }}">Overview</a>
      <a href="{{ url_for('accounts.index') }}" class="{{ 'on' if page=='accounts' }}">Accounts</a>
      <a href="{{ url_for('income.index') }}" class="{{ 'on' if page=='income' }}">Income</a>
      <a href="{{ url_for('expenses.index') }}" class="{{ 'on' if page=='expenses' }}">Expenses</a>
      <a href="{{ url_for('data.index') }}" class="{{ 'on' if page=='data' }}">Data{% if drive_level %}<i class="dot {{ drive_level }}" title="Google Drive sync"></i>{% endif %}</a>
    </nav>
    <button class="theme" id="themeBtn" type="button" aria-label="Switch light or dark mode">
      <span class="t-dark">Dark</span><span class="t-light">Light</span>
    </button>
  </aside>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="toast {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/calc.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
